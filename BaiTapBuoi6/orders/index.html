<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/theme.css" />

    <style>
      h2 {
        color: blue;
      }
    </style>
  </head>
  <body>
    <h1 style="color: orange">ORDERS PAGE</h1>
    <h2 class="title" id="special" style="color: pink">Danh sach don hang</h2>
    <!--
  Phan tu nay co: tag(h2) + class(.title) + id(#special) + internal(color:blue) + inline style="color: pink;"
  Selector thang: inline style vi: inline style vi css trực tiếp trên cùng dòng code của html
  Mau hien thi: pink
-->
    <p style="color: green">Don hang 001</p>
    <p style="color: green">Don hang 002</p>
    <p class="highlight">Don hang 003</p>
    <p class="highlight">Don hang 004</p>
  </body>
</html>
<!-- Quan sát: phần tử h2 có cả .title + #special + inline style — cái nào thắng?
 
Inline style thắng VÌ css trực tiếp trên chính dòng đó-->
