<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .toast {
        display: none;
        padding: 12px 20px;
        background: rgb(188, 242, 188);
      }

      .star-icon {
        height: 20px;
        width: 20px;
        margin-right: 15px;
      }

      .close-icon {
        height: 20px;
        width: 20px;
        background: #54ad69;
        margin-left: 15px;
      }

      .open-btn {
        padding: 12px 20px;
        background: #5f5f5f;
        color: #fff;
        border: none;
      }

      #toast-toggle:checked ~ .toast {
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <input type="checkbox" id="toast-toggle" hidden />
    <label for="toast-toggle" class="open-btn">Hien thong bao</label>

    <div id="box" class="toast">
      <img src="./css/star-solid.svg" alt="" class="star-icon" />
      <span>Luu thanh cong</span>
      <label for="toast-toggle" class="close-btn">
        <img src="./css/close-icon.svg" alt="" class="close-icon" />
      </label>
    </div>
  </body>
</html>
