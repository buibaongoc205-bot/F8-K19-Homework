<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .hh {
        display: flex;
        gap: 30px;
      }
      .box1 {
        width: 80px;
        height: 80px;
        border: 2px solid red;
      }

      .box2 {
        width: 120px;
        height: 50px;
        border: 2px solid blue;
      }

      .box3 {
        border-width: 80px 40px;
        border-style: solid;
        border-color: transparent transparent rgb(14, 215, 151) transparent;
      }

      .box4 {
        border-width: 80px 40px;
        border-style: solid;
        border-color: rgb(221, 170, 3) transparent transparent transparent;
      }

      .box5 {
        border-width: 50px;
        border-style: solid;
        border-color: transparent plum transparent transparent;
      }
    </style>
  </head>
  <body>
    <main>
      <h2>Các hình có thể được tạo với Border</h2>
      <div class="hh">
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
        <div class="box4"></div>
        <div class="box5"></div>
        <div class="box6"></div>
        <div class="box7"></div>
      </div>
    </main>
  </body>
</html>
